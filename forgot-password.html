<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Reset Password — Positive Arena Gold</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:#090d14}
    .shell{width:min(100%,440px)}
    .brand-center{display:flex;align-items:center;gap:12px}.app-icon{width:52px;height:52px;border-radius:14px;display:block}
    .cardx{background:#111722;border:1px solid #283246;border-radius:22px;padding:20px;margin-top:16px}
    .field{margin-top:12px}.field label{display:block;font-size:12px;color:#9ba6b8;margin-bottom:7px;font-weight:800}
    .field input{width:100%;background:#0d131c;color:#fff;border:1px solid #283246;border-radius:12px;padding:13px;font-size:16px;outline:none}
    .submit{width:100%;margin-top:16px;border:1px solid #506486;background:#1b2740;color:#fff;border-radius:12px;padding:13px;font-weight:900;cursor:pointer}
    .msg{margin-top:12px;color:#9ba6b8;line-height:1.5;font-size:13px;min-height:20px}.msg.error{color:#ff7083}.msg.ok{color:#44d69b}
    .back{display:block;text-align:center;margin-top:16px;color:#e6bf5d;text-decoration:none;font-weight:800}
    .mini{color:#9ba6b8;font-size:13px;line-height:1.5;margin-top:8px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand-center"><img src="favicon.svg" class="app-icon" alt="Positive Arena"><div><div class="ey">POSITIVE ARENA</div><div class="title">Forgot Password</div></div></div>
    <div class="mini">Enter the email address you used for your Gold Signals account. We’ll send you a secure password-reset link.</div>
    <section class="cardx">
      <form id="forgotForm">
        <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div>
        <button id="sendBtn" class="submit" type="submit">Send Reset Link</button>
        <div id="msg" class="msg"></div>
      </form>
      <a class="back" href="login.html">← Back to Login</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb=window.supabase.createClient('https://nsmevyhcpqijreuwbqkv.supabase.co','sb_publishable_vmjgX7GlO7iB32tlZRPfBQ__qv6ZixS');
    const form=document.getElementById('forgotForm');
    const msg=document.getElementById('msg');
    const btn=document.getElementById('sendBtn');
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      msg.textContent='';msg.className='msg';btn.disabled=true;btn.textContent='Sending…';
      const email=document.getElementById('email').value.trim();
      const redirectTo=new URL('reset-password.html',location.href).href;
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
      btn.disabled=false;btn.textContent='Send Reset Link';
      if(error){msg.textContent=error.message;msg.className='msg error';return}
      msg.textContent='Reset link sent. Check your email, open the link, then choose a new password.';msg.className='msg ok';
    });
  </script>
</body>
</html>
