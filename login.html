<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Positive Arena Gold — Member Access</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:#090d14}
    .auth-shell{width:min(100%,440px)}
    .auth-card{background:#111722;border:1px solid #283246;border-radius:22px;padding:20px;margin-top:16px}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
    .auth-tab{border:1px solid #283246;background:#151d2a;color:#b7c0cf;border-radius:12px;padding:11px;font-weight:850;cursor:pointer}
    .auth-tab.active{background:#1b2740;color:#fff;border-color:#506486}
    .auth-form{display:none}.auth-form.active{display:block}
    .field{margin-top:12px}.field label{display:block;font-size:12px;color:#9ba6b8;margin-bottom:7px;font-weight:800}
    .field input{width:100%;background:#0d131c;color:#fff;border:1px solid #283246;border-radius:12px;padding:13px;font-size:16px;outline:none}
    .password-wrap{position:relative}.password-wrap input{padding-right:78px}
    .show-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#1b2740;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer}
    .submit{width:100%;margin-top:16px;border:1px solid #506486;background:#1b2740;color:#fff;border-radius:12px;padding:13px;font-weight:900;cursor:pointer}
    .msg{margin-top:12px;color:#9ba6b8;line-height:1.5;font-size:13px;min-height:20px}.msg.error{color:#ff7083}.msg.ok{color:#44d69b}
    .brand-center{display:flex;align-items:center;gap:10px}.mini{color:#9ba6b8;font-size:13px;line-height:1.5;margin-top:8px}
    .trial-box{margin-top:14px;border:1px solid #55482a;background:#15130d;border-radius:15px;padding:13px;color:#e6bf5d;font-weight:850;line-height:1.45}
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="brand-center"><div class="logo">AU</div><div><div class="ey">POSITIVE ARENA</div><div class="title">Gold Signals Test App</div></div></div>
    <div class="trial-box">🎁 Gold (XAUUSD) only · 30-day free test trial.</div>
    <div class="mini">Create an account or sign in to view the Gold dashboard, live chart and verified V6 setups. No subscription or payment is required during this test phase.</div>

    <section class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" type="button">Login</button>
        <button class="auth-tab" data-tab="signup" type="button">Sign Up</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label for="loginPassword">Password</label><div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" minlength="6" required><button class="show-btn" type="button" data-toggle="loginPassword">Show</button></div></div>
        <button class="submit" type="submit">Login to Gold Dashboard</button>
        <div id="loginMsg" class="msg"></div>
      </form>

      <form id="signupForm" class="auth-form">
        <div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label for="signupPassword">Password</label><div class="password-wrap"><input id="signupPassword" type="password" autocomplete="new-password" minlength="6" required><button class="show-btn" type="button" data-toggle="signupPassword">Show</button></div></div>
        <div class="field"><label for="signupConfirm">Confirm password</label><div class="password-wrap"><input id="signupConfirm" type="password" autocomplete="new-password" minlength="6" required><button class="show-btn" type="button" data-toggle="signupConfirm">Show</button></div></div>
        <button class="submit" type="submit">Start 30-Day Gold Trial</button>
        <div id="signupMsg" class="msg"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb=window.supabase.createClient('https://nsmevyhcpqijreuwbqkv.supabase.co','sb_publishable_vmjgX7GlO7iB32tlZRPfBQ__qv6ZixS');
    const next=new URLSearchParams(location.search).get('next')||'index.html';
    const safeNext=/^[a-zA-Z0-9._-]+\.html$/.test(next)?next:'index.html';

    document.querySelectorAll('.auth-tab').forEach(btn=>btn.addEventListener('click',()=>{
      document.querySelectorAll('.auth-tab').forEach(b=>b.classList.toggle('active',b===btn));
      document.querySelectorAll('.auth-form').forEach(f=>f.classList.toggle('active',f.id===(btn.dataset.tab==='login'?'loginForm':'signupForm')));
    }));

    document.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>{
      const input=document.getElementById(btn.dataset.toggle);
      const showing=input.type==='text';
      input.type=showing?'password':'text';
      btn.textContent=showing?'Show':'Hide';
    }));

    const setMsg=(id,text,ok=false)=>{const e=document.getElementById(id);e.textContent=text||'';e.className='msg '+(text?(ok?'ok':'error'):'')};

    document.getElementById('loginForm').addEventListener('submit',async e=>{
      e.preventDefault();setMsg('loginMsg','');
      const email=document.getElementById('loginEmail').value.trim();
      const password=document.getElementById('loginPassword').value;
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error){setMsg('loginMsg',error.message);return}
      location.replace(safeNext);
    });

    document.getElementById('signupForm').addEventListener('submit',async e=>{
      e.preventDefault();setMsg('signupMsg','');
      const email=document.getElementById('signupEmail').value.trim();
      const password=document.getElementById('signupPassword').value;
      const confirm=document.getElementById('signupConfirm').value;
      if(password!==confirm){setMsg('signupMsg','Passwords do not match.');return}
      const redirectTo=new URL('login.html',location.href).href;
      const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:redirectTo}});
      if(error){setMsg('signupMsg',error.message);return}
      if(data.session){location.replace(safeNext);return}
      setMsg('signupMsg','Account created. Check your email to confirm your account, then log in to start the 30-day Gold test trial.',true);
    });

    sb.auth.getSession().then(({data})=>{if(data.session)location.replace(safeNext)});
  </script>
</body>
</html>
