<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PA Gold">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Choose New Password — Positive Arena Gold</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:#090d14}.shell{width:min(100%,440px)}.brand-center{display:flex;align-items:center;gap:12px}.app-icon{width:52px;height:52px;border-radius:14px;display:block}.cardx{background:#111722;border:1px solid #283246;border-radius:22px;padding:20px;margin-top:16px}.field{margin-top:12px}.field label{display:block;font-size:12px;color:#9ba6b8;margin-bottom:7px;font-weight:800}.field input{width:100%;background:#0d131c;color:#fff;border:1px solid #283246;border-radius:12px;padding:13px;font-size:16px;outline:none}.password-wrap{position:relative}.password-wrap input{padding-right:78px}.show-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#1b2740;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer}.submit{width:100%;margin-top:16px;border:1px solid #506486;background:#1b2740;color:#fff;border-radius:12px;padding:13px;font-weight:900;cursor:pointer}.submit:disabled{opacity:.6}.msg{margin-top:12px;color:#9ba6b8;line-height:1.5;font-size:13px;min-height:20px}.msg.error{color:#ff7083}.msg.ok{color:#44d69b}.msg.info{color:#e6bf5d}.back{display:block;text-align:center;margin-top:16px;color:#e6bf5d;text-decoration:none;font-weight:800}.mini{color:#9ba6b8;font-size:13px;line-height:1.5;margin-top:8px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand-center"><img src="favicon.svg" class="app-icon" alt="Positive Arena"><div><div class="ey">POSITIVE ARENA</div><div class="title">Create New Password</div></div></div>
    <div class="mini">Choose a new password for your Gold Signals account.</div>
    <section class="cardx">
      <form id="resetForm">
        <div class="field"><label for="newPassword">New password</label><div class="password-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="6" required><button class="show-btn" type="button" data-toggle="newPassword">Show</button></div></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><div class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button class="show-btn" type="button" data-toggle="confirmPassword">Show</button></div></div>
        <button id="saveBtn" class="submit" type="submit" disabled>Preparing secure reset…</button>
        <div id="msg" class="msg info">Verifying your password-reset link…</div>
      </form>
      <a class="back" href="login.html">← Back to Login</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa.js"></script>
  <script>
    const sb=window.supabase.createClient('https://nsmevyhcpqijreuwbqkv.supabase.co','sb_publishable_vmjgX7GlO7iB32tlZRPfBQ__qv6ZixS');
    const msg=document.getElementById('msg'),form=document.getElementById('resetForm'),btn=document.getElementById('saveBtn');
    let recoveryReady=false;
    document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById(b.dataset.toggle),show=i.type==='text';i.type=show?'password':'text';b.textContent=show?'Show':'Hide'}));
    const ready=()=>{recoveryReady=true;btn.disabled=false;btn.textContent='Save New Password';msg.textContent='Reset link verified. Enter and save your new password.';msg.className='msg ok'};
    const fail=()=>{if(recoveryReady)return;btn.disabled=true;btn.textContent='Reset Link Required';msg.textContent='This reset link is invalid or has expired. Return to Login → Forgot password and request a new reset email.';msg.className='msg error'};
    sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session)ready()});
    (async()=>{
      const {data:{session}}=await sb.auth.getSession();
      if(session){ready();return}
      const qs=new URLSearchParams(location.search);
      if(qs.get('code')){
        const {error}=await sb.auth.exchangeCodeForSession(qs.get('code'));
        if(!error){ready();return}
      }
      setTimeout(fail,1800);
    })();
    form.addEventListener('submit',async e=>{e.preventDefault();if(!recoveryReady){fail();return}const p1=document.getElementById('newPassword').value,p2=document.getElementById('confirmPassword').value;if(p1!==p2){msg.textContent='Passwords do not match.';msg.className='msg error';return}btn.disabled=true;btn.textContent='Saving…';const {error}=await sb.auth.updateUser({password:p1});if(error){btn.disabled=false;btn.textContent='Save New Password';msg.textContent=error.message;msg.className='msg error';return}msg.textContent='Password changed successfully. Returning to login…';msg.className='msg ok';setTimeout(async()=>{await sb.auth.signOut();location.replace('login.html')},1400)});
  </script>
</body>
</html>
