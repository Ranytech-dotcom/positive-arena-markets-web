<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Positive Arena Gold Signal History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="history">
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="logo">AU</div><div><div class="ey">POSITIVE ARENA</div><div class="title">Gold Signal History</div></div></div>
      <div class="top-actions"><div class="gold-only">XAUUSD ONLY</div><div id="trialBadge" class="trial-badge">30-DAY TRIAL</div></div>
    </header>

    <div class="section-title"><div><div class="ey">VERIFIED V6 ACTIVITY</div><h2>Gold signals</h2></div><button id="refresh" class="refresh" type="button">Refresh</button></div>
    <div class="filters" id="historyFilters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="buy">BUY</button>
      <button class="filter" data-filter="sell">SELL</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="closed">Closed</button>
    </div>
    <div id="history"></div>
    <div id="status" class="foot">Connecting to Gold V6…</div>
  </main>
  <nav class="bottom-nav">
    <a href="index.html">Gold</a>
    <a class="active" href="history.html">History</a>
    <a href="calendar.html">Calendar</a>
    <a href="settings.html">Settings</a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
